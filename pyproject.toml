[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calorai-agent"
version = "0.1.0"
description = "Conversational meal-logging agent: LangGraph, tool calling, split text/vision models, persistent memory"
requires-python = ">=3.11"

# Mirrors requirements.txt. Kept in both places on purpose: requirements.txt is
# what people reach for first, pyproject is what makes `pip install -e .` work
# and therefore what makes `python -m calorai.cli` work from a clean clone.
dependencies = [
    "langgraph>=0.2.28",
    "langchain-core>=0.3.15",
    "langchain-groq>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain-ollama>=0.2.0",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyflakes>=3.0"]
ui = ["streamlit>=1.40"]

[project.scripts]
calorai = "calorai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
